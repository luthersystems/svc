name: CI Tests
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Pin to the module's Go version rather than floating "stable":
          # the golangci-lint v2.11 binary (built with Go 1.26) cannot read
          # export data produced by newer toolchains (Go 1.27 broke it with
          # "export data version 4 is greater than maximum supported version 2").
          go-version-file: go.mod
      - name: Clean Go Module Cache (needed for cilint in some cases)
        run: go clean -modcache
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
      - name: Run CI tests
        run: script -q -e -c "make citest"
  # Known-vulnerability gate: call-graph-aware, fails only on vulns whose
  # vulnerable code this module actually reaches.
  govulncheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
