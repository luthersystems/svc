name: CI Tests
on:
  # The push run on main is what release-tag.yml checks before it tags a
  # commit: a squash merge makes a new commit that no pull request run tested.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Pin to the module's Go version rather than floating "stable":
          # a golangci-lint binary built with an older Go cannot read
          # export data produced by newer toolchains (Go 1.27 broke it with
          # "export data version 4 is greater than maximum supported version 2").
          # setup-go installs go.mod's `toolchain` line exactly; without that
          # line it would install the `go` directive's 1.26.0 release.
          go-version-file: go.mod
      - name: Clean Go Module Cache (needed for cilint in some cases)
        run: go clean -modcache
      # golangci-lint itself runs in the shared Quality workflow
      # (.github/workflows/quality.yml). `golangci-lint run` accepts a
      # misspelled key in .golangci.yml and ignores it; only the schema check
      # catches it, and the shared workflow does not run it yet, so it runs
      # here. Keep the version equal to the shared workflow's pin.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: golangci-lint config schema
        run: golangci-lint config verify
      - name: Run CI tests
        run: script -q -e -c "make citest"
  # govulncheck runs in security.yml, which calls the shared Security
  # workflow from luthersystems/.github.
