name: CI Tests
on:
  # The push run on main is what release-tag.yml checks before it tags a
  # commit: a squash merge makes a new commit that no pull request run tested.
  push:
    branches:
      - main
  # No paths filter: the gate job below is a required check, so every PR
  # must start a run. The changes job skips the build on docs-only PRs.
  pull_request:
    branches:
      - main
  # The merge queue is on: it waits for the required checks on the merged
  # commit, so the gate must run there too.
  merge_group:
jobs:
  # Decides whether the build and test job must run (scripts/ci-changes.sh).
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # On a pull request this checks out the merge commit. Its first parent
      # is the base branch tip, so depth 2 is enough for the diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the decision script and the gate's needs list
        run: ./scripts/ci-changes-test.sh
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            ./scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Pin to the module's Go version rather than floating "stable":
          # a golangci-lint binary built with an older Go cannot read
          # export data produced by newer toolchains (Go 1.27 broke it with
          # "export data version 4 is greater than maximum supported version 2").
          # setup-go installs go.mod's `toolchain` line exactly; without that
          # line it would install the `go` directive's 1.26.0 release.
          go-version-file: go.mod
      - name: Clean Go Module Cache (needed for cilint in some cases)
        run: go clean -modcache
      # golangci-lint itself runs in the shared Quality workflow
      # (.github/workflows/quality.yml). `golangci-lint run` accepts a
      # misspelled key in .golangci.yml and ignores it; only the schema check
      # catches it, and the shared workflow does not run it yet, so it runs
      # here. Keep the version equal to the shared workflow's pin.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: golangci-lint config schema
        run: golangci-lint config verify
      - name: Run CI tests
        run: script -q -e -c "make citest"
  # govulncheck runs in security.yml, which calls the shared Security
  # workflow from luthersystems/.github.

  ci-all:
    name: CI (all required checks)
    # always(), so the gate reports on every run. A cancelled or failed job
    # then fails the gate below. A gate that did not run, or was skipped,
    # could count as passing for the required check.
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # Pass only if the changes job succeeded and every other job succeeded,
      # or was skipped because the changes job said the PR is docs-only
      # (code=false). Any other skip fails, so a job skipped by mistake
      # cannot pass the gate.
      - name: Fail unless every required job passed
        if: >-
          needs.changes.result != 'success'
          || contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "::error::A required CI job failed, was cancelled or was skipped."
          exit 1
      - name: Every required job passed or was skipped as docs-only
        run: echo "ok"
